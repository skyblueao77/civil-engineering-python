[project]
name = "civil-engineering-python"
version = "0.1.0"
description = "Python learning materials for civil engineering students"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "matplotlib-fontja>=1.1.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pandas-stubs>=3.0.5.260730",
    "scipy>=1.18.0",
    "scipy-stubs>=1.18.0.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
