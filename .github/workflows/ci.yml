name: CI & Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 毎週月曜 09:00 JST (00:00 UTC) に依存関係の脆弱性監査を実行
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lockfile, Lint, Unit & Notebook Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (no third-party actions)
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install uv
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://astral.sh/uv/install.sh | sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Verify uv.lock consistency
        run: uv lock --check

      - name: Install dependencies strictly from uv.lock
        run: uv sync --locked --all-groups

      - name: Run Ruff lint and security checks (E, F, I, S)
        run: uv run ruff check .

      - name: Run pytest unit tests and execute all notebooks
        run: uv run pytest --nbmake

  dependency-audit:
    name: Dependency Vulnerability Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (no third-party actions)
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install uv
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://astral.sh/uv/install.sh | sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install dependencies strictly from uv.lock
        run: uv sync --locked --all-groups

      - name: Audit installed packages for known vulnerabilities
        run: uv run pip-audit --strict
