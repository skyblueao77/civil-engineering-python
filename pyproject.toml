[project]
name = "civil-engineering-python"
version = "0.1.0"
description = "Python learning materials for civil engineering students"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.1.4",
    "html5lib>=1.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "lxml>=6.1.2",
    "matplotlib>=3.11.1",
    "matplotlib-fontja>=1.1.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pandas-stubs>=3.0.5.260730",
    "scipy==1.18.1",
    "scipy-stubs==1.18.1.1",
]

[dependency-groups]
dev = [
    "nbmake>=1.5.5",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff==0.17.5",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "S"] # E: Error, F: Pyflakes, I: isort, S: flake8-bandit (セキュリティ)

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"] # pytest では assert を使用するため除外
